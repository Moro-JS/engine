name: ci

# One per-commit gate. Everything that decides "is this commit good" lives here:
# C++ unit tests, the addon driven through the conformance/hardening suites, the
# full cross-platform build + smoke matrix, ASan/UBSan, and a fuzz-harness smoke.
# Every build produces two binaries per ABI - BoringSSL inside, or linked to
# node's OpenSSL - and `npm run test:suites` runs against both.
# Branch protection should require ONLY the `ci-success` job at the bottom — it
# goes green iff every job here passed.
#
# Deliberately NOT here: the sustained fuzz campaign (fuzz.yml, nightly — slow,
# corpus-accumulating discovery, not a pass/fail gate) and publishing to npm
# (release.yml, fired by publishing a GitHub Release for a vX.Y.Z tag).
on:
  push:
    branches: [main]
  pull_request:
  # boringssl-roll.yml runs this whole gate against a candidate BoringSSL
  # before the pin file is committed: `boringssl_pin` overrides
  # tools/boringssl.json for every build in the run.
  workflow_call:
    inputs:
      boringssl_pin:
        description: '<tag>@<commit> to build instead of the pinned BoringSSL'
        type: string
        default: ''
      # release.yml runs this gate inside a release run, which uploads its own
      # binaries-* artifacts (the ones it publishes): the gate's go under
      # another name there. Empty on a push, a pull request and the roll.
      artifact_prefix:
        description: 'Prefix for the names of the artifacts this run uploads'
        type: string
        default: ''

# Nothing here writes to the repository: every job builds and tests. Stated,
# so that the token these jobs hold (and every action and every fetched
# toolchain or library that runs beside it) is read-only whatever the
# repository's default is.
permissions:
  contents: read

# Empty unless called with a candidate (tools/boringssl.mjs ignores an empty value).
env:
  MORO_BORINGSSL_PIN: ${{ inputs.boringssl_pin }}

# Keep the gate snappy: drop superseded runs on the same ref. (github.workflow
# is the caller's name when this file is called, so a roll's verification and
# a push to main never cancel each other.)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast correctness ────────────────────────────────────────────────────────

  # Pure-C++ parser + WebSocket unit tests. No Node/addon build needed:
  # test/run-unit.sh compiles test/http-parser-unit.cpp and
  # test/websocket-unit.cpp directly with clang++.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: C++ unit tests
        run: sh test/run-unit.sh
      # The native surface is declared in four places (binding, NATIVE_API,
      # index.mjs, index.d.ts) plus caps/options in two; drift fails the gate.
      - name: Export-drift gate
        run: npm run check:exports

  # Build the addon for the running Node's ABI, then run the conformance
  # suites against the real built engine. Linux builds use g++ (build.mjs
  # default), which ships on ubuntu-latest.
  integration:
    runs-on: ubuntu-latest
    env:
      CXX: g++ # correctness lane; the shipping Linux lanes build with clang-18 (see linux-gnu)
      # ubuntu-latest (24.04, kernel 6.8) would auto-select io_uring: this lane
      # is the libuv path, and REQUIRE makes a silent switch a failure.
      MORO_ENGINE_TRANSPORT: uv
      MORO_ENGINE_REQUIRE_TRANSPORT: uv
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build engine for this Node ABI
        run: node tools/build.mjs
      # The OpenSSL binary links the OpenSSL exported by the host node binary;
      # assert those exports exist on this leg before running the TLS suites.
      - name: Assert node exports OpenSSL symbols
        run: nm -D "$(command -v node)" | grep -q SSL_CTX_new
      - name: Smoke + every node --test suite (package.json test:suites)
        run: npm run test:smoke && npm run test:suites

  # The same suites with each diagnostics kill switch flipped, so the fallback
  # paths (plain callbacks, re-entrant notification delivery) stay green too.
  integration-variants:
    runs-on: ubuntu-latest
    env:
      CXX: g++
      MORO_ENGINE_TRANSPORT: uv
      MORO_ENGINE_REQUIRE_TRANSPORT: uv
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fastcall-off
            envvar: MORO_ENGINE_FASTCALL=0
          - name: notify-sync
            envvar: MORO_ENGINE_NOTIFY=sync
          - name: batch-off
            envvar: MORO_ENGINE_BATCH=0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build engine for this Node ABI
        run: node tools/build.mjs
      - name: Smoke + every node --test suite (${{ matrix.name }})
        run: env ${{ matrix.envvar }} sh -c 'npm run test:smoke && npm run test:suites'

  # The io_uring transport: every suite on kernels that have it (24.04 =
  # 6.8), REQUIRE makes a silent fallback to epoll a failure. Runs on both
  # arches; the musl build gets its own container lane below.
  integration-uring:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        node-version: [20, 22, 24, 26]
    runs-on: ${{ matrix.runner }}
    env:
      CXX: g++
      MORO_ENGINE_TRANSPORT: uring
      MORO_ENGINE_REQUIRE_TRANSPORT: uring
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build engine for this Node ABI
        run: node tools/build.mjs
      - name: Kernel + transport in use
        run: uname -r && node -e "console.log(require('./packages/engine').probe())"
      - name: Real-kernel ring unit
        run: sh test/run-unit.sh
      - name: Smoke + every node --test suite on io_uring
        run: npm run test:smoke && npm run test:suites
      - name: Connection-churn soak on io_uring
        run: npm run test:soak

  # Silent degradation proof: Docker's default seccomp profile blocks
  # io_uring_setup (an explicit profile here so the lane is deterministic
  # across Docker versions); the engine must fall back to epoll (the Linux
  # default since 1.1.10), report why, and pass the suites. Then the same
  # container with seccomp lifted must run io_uring - which is exactly what
  # the-benchmarker needs to exercise it.
  fallback-seccomp:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - name: Build engine (host ABI 24) inside the container image
        run: |
          docker run --rm -e MORO_BORINGSSL_PIN -v "$PWD:/repo" -w /repo node:24-bookworm \
            sh -c "apt-get update -qq >/dev/null && apt-get install -y -qq g++ cmake git >/dev/null && CXX=g++ node tools/build.mjs"
      - name: io_uring blocked by seccomp -> epoll, with the reason
        run: |
          docker run --rm --security-opt seccomp=test/ci/seccomp-block-io_uring.json \
            -v "$PWD:/repo" -w /repo -e MORO_ENGINE_TRANSPORT=uring -e MORO_ENGINE_REQUIRE_TRANSPORT=epoll node:24-bookworm \
            sh -c "node -e \"const p=require('./packages/engine').probe(); console.log(p.transport, '-', p.transportReason); if (p.transport!=='epoll' || !/EPERM|ENOSYS/.test(p.transportReason)) process.exit(1)\" && npm run test:smoke && node --test test/conformance.test.mjs test/probe-transport.test.mjs"
      - name: seccomp lifted -> io_uring inside the container
        run: |
          docker run --rm --security-opt seccomp=unconfined \
            -v "$PWD:/repo" -w /repo -e MORO_ENGINE_TRANSPORT=uring -e MORO_ENGINE_REQUIRE_TRANSPORT=uring node:24-bookworm \
            sh -c "uname -r && npm run test:smoke && npm run test:suites"

  # musl build on io_uring (covers the musl syscall() wrappers).
  conformance-musl-uring:
    needs: [linux-musl]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_prefix }}binaries-linux-*-musl
          merge-multiple: true
          path: build/
      - name: Smoke + suites on io_uring (Alpine)
        run: |
          docker run --rm --security-opt seccomp=unconfined -v "$PWD:/repo" -w /repo \
            -e MORO_ENGINE_TRANSPORT=uring -e MORO_ENGINE_REQUIRE_TRANSPORT=uring node:24-alpine \
            sh -c "uname -r && npm run test:smoke && npm run test:suites && npm run test:soak"

  # ── Sanitizers ──────────────────────────────────────────────────────────────

  # ASan + UBSan over the standalone C++ unit tests. A sanitizer finding is a
  # release blocker (CONTRIBUTING.md).
  asan-ubsan:
    runs-on: ubuntu-latest
    env:
      # Belt-and-suspenders with -fno-sanitize-recover=all: abort with a trace
      # on the first sanitizer error.
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang
      # test/run-unit.sh hardcodes -O2 with no CXXFLAGS/sanitizer hook, so
      # compile the two pure-C++ unit tests directly with the sanitizers.
      # -fno-sanitize-recover=all makes any finding a non-zero exit.
      - name: text helper unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/text-unit.cpp -o /tmp/moro_text_asan
          /tmp/moro_text_asan
      - name: response-template unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/response-template-unit.cpp -o /tmp/moro_tpl_asan
          /tmp/moro_tpl_asan
      - name: io_uring fake-kernel unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/uring-fake-unit.cpp -o /tmp/moro_uring_asan
          /tmp/moro_uring_asan
      - name: HTTP parser unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/http-parser-unit.cpp -o /tmp/moro_hp_asan
          /tmp/moro_hp_asan
      - name: HTTP/2 unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/http2-unit.cpp -o /tmp/moro_h2_asan
          /tmp/moro_h2_asan test/fixtures/hpack-vectors.txt
      - name: WebSocket unit tests (ASan/UBSan)
        run: |
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/websocket-unit.cpp -o /tmp/moro_ws_asan
          /tmp/moro_ws_asan
      - name: permessage-deflate unit tests (ASan/UBSan)
        run: |
          sudo apt-get update && sudo apt-get install -y zlib1g-dev
          clang++ -std=c++20 -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all \
            test/ws-deflate-unit.cpp -lz -o /tmp/moro_pmd_asan
          /tmp/moro_pmd_asan

  # The unit tests above cover the pure parsers; this job covers what they
  # can't: server.h's connection/timeout/framing state machine and binding.cpp,
  # which own buffers across async lifetimes (the use-after-free territory).
  # The addon is built with ASan/UBSan and the full conformance + hardening +
  # WS suites run against it under a preloaded sanitizer runtime.
  asan-addon:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        transport: [epoll, uv, uring]
    env:
      # detect_leaks=0: Node itself reports benign leaks at exit that would
      # drown real findings; ASan's memory-error detection is unaffected.
      ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      CXX: g++ # the LD_PRELOAD flow below is gcc's libasan/libubsan
      # Every transport under the sanitizers, the Linux default (epoll) first:
      # each has its own write queue and its own lifetimes for ASan to see
      # (the kernel's writes into provided buffers are covered by the ring
      # tests). This build is also the one with the fault points
      # (MORO_ENGINE_TEST_FAULTS), so the tests that need them run here.
      MORO_ENGINE_TRANSPORT: ${{ matrix.transport }}
      MORO_ENGINE_REQUIRE_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build addon with ASan/UBSan
        run: node tools/build.mjs --sanitize
      - name: Every node --test suite against the sanitized addon
        run: |
          export LD_PRELOAD="$(g++ -print-file-name=libasan.so) $(g++ -print-file-name=libubsan.so)"
          npm run test:suites

  # ── Fuzz-harness smoke (the sustained campaign is nightly in fuzz.yml) ───────

  # Prove the libFuzzer harnesses still BUILD and survive a short run on their
  # seed corpus — catches a parser signature change breaking a harness or an
  # instantly-reproducing crash. This is a smoke, NOT the deep campaign
  # (fuzz.yml). No corpus cache: a smoke needs no accumulated coverage.
  fuzz-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fuzzer: [http, httpdiff, ws, http2, tls, pmd, uring]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install clang (+ OpenSSL/zlib headers for the tls/pmd harnesses)
        run: sudo apt-get update && sudo apt-get install -y clang libssl-dev zlib1g-dev
      - name: Fuzz-smoke ${{ matrix.fuzzer }} (20s)
        run: FUZZ_SECONDS=20 sh test/fuzz/run.sh ${{ matrix.fuzzer }}

  # ── Cross-platform build + smoke (every published binary flavor) ────────────

  # Darwin: one arm64 host cross-targets both arches (build.mjs --arch flag).
  darwin:
    # Node 25/26's V8 headers use braced-init template args (P2308) that need
    # clang 18+; the runner's Apple clang is older, so build with Homebrew LLVM.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - name: Use Homebrew LLVM (clang 18+ for Node 25/26 V8 headers)
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          command -v cmake >/dev/null || brew install cmake
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: node tools/build.mjs --all --arch arm64
      - run: node tools/build.mjs --all --arch x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-darwin
          path: build/*.node

  # Built as release.yml builds the shipped binaries: inside the glibc 2.28
  # image (manylinux_2_28, AlmaLinux 8) with clang 18, so they load on glibc
  # 2.28 and later, Node.js's own floor (built on the runner, they needed
  # 2.35). tools/linux-gnu-build.sh installs the toolchain, runs the build
  # with the runner's Node mounted at /opt/node, and fails if a binary needs
  # a newer glibc. The smoke jobs below load the binaries on the runners.
  linux-gnu:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            image: quay.io/pypa/manylinux_2_28_x86_64:2026.11.14-1@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
          - runner: ubuntu-22.04-arm
            arch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64:2026.11.14-1@sha256:34a5e614a4eb26f73f8bf44cbbf2acf8011620453d03ea35a58537bb3cde44de
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ matrix.image }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs', 'tools/linux-gnu-build.sh') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build in the glibc 2.28 image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e MORO_BORINGSSL_PIN -v "$PWD:/repo" -w /repo -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            "$IMAGE" sh tools/linux-gnu-build.sh node tools/build.mjs --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-linux-${{ matrix.arch }}-gnu
          path: build/*.node

  # Musl builds run the Alpine container via explicit `docker run`, not
  # `container:`: JS actions (checkout/upload-artifact) inside Alpine
  # containers are only supported on x64 runners — on arm64 the runner has no
  # musl Node to inject and the job dies at checkout. Host steps stay glibc.
  linux-musl:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - name: Build in Alpine container (musl)
        run: |
          docker run --rm -e MORO_BORINGSSL_PIN -v "$PWD:/repo" -w /repo node:24-alpine \
            sh -c "apk add --no-cache build-base clang lld llvm cmake git linux-headers && node tools/build.mjs --all"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-linux-${{ matrix.arch }}-musl
          path: build/*.node

  # The full PGO cycle (instrument -> train -> merge -> optimise), strict: a
  # broken profile flow fails here instead of silently shipping plain builds
  # from release.yml's lenient run. The suites then run against the PGO'd
  # binary, so a profile-induced miscompile would surface as a test failure.
  # The cycle runs in release.yml's build image and toolchain (see linux-gnu),
  # the suites on the runner. As in a release: two ABIs, so that training
  # under a fetched Node.js (26 here) is exercised as well as under the
  # runner's, and with seccomp lifted so that the io_uring group trains -
  # MORO_PGO_REQUIRE makes it a failure if it cannot.
  pgo-linux:
    runs-on: ubuntu-24.04
    env:
      IMAGE: quay.io/pypa/manylinux_2_28_x86_64:2026.11.14-1@sha256:d086f64cddcace250ef0f0073583c51b8298159303290a730c9f59bd91edfd2c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ env.IMAGE }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs', 'tools/linux-gnu-build.sh') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: PGO cycle (strict), in the glibc 2.28 image
        run: |
          docker run --rm --security-opt seccomp=unconfined -e MORO_BORINGSSL_PIN -e MORO_PGO_REQUIRE=uring \
            -v "$PWD:/repo" -w /repo -v "$(dirname "$(dirname "$(command -v node)")"):/opt/node:ro" \
            "$IMAGE" sh tools/linux-gnu-build.sh node tools/pgo.mjs --strict --abi 137,147
      - name: Smoke + every suite against the PGO-optimised binary
        run: npm run test:smoke && npm run test:suites

  # HTTP/1.1 conformance against the unmodified h1spec driver (Deno), pinned
  # to a commit - the 33/33 bar checked per commit here, not only weekly in the
  # benchmark repo.
  h1spec:
    runs-on: ubuntu-latest
    env:
      CXX: g++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Build engine for this Node ABI
        run: node tools/build.mjs
      - name: Run h1spec against the engine
        run: bash test/h1spec/run.sh  # the script uses bash (set -o pipefail); sh is dash on Ubuntu

  # Windows (MSVC): build.mjs downloads the per-version node.lib
  # (SHASUMS-verified) and compiles with cl.exe (/DELAYLOAD:node.exe + the
  # delay-load hook so the addon binds to any host exe name). BoringSSL is
  # built with the same cl.exe (cmake + ninja, NASM for the assembly).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      # Third-party action pinned to a full commit SHA (supply-chain integrity);
      # Dependabot (.github/dependabot.yml) bumps the SHA + comment on new tags.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # BoringSSL's x64 assembly on Windows is NASM source.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - run: node tools/build.mjs --all
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-windows-x64
          path: build/*.node

  # The same for the musl binaries, in release.yml's Alpine image with what it
  # installs there (compiler-rt is the profile runtime): strict, then smoke
  # and the suites against the PGO'd binaries, on the default transport (epoll).
  pgo-musl:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - name: PGO cycle (strict), smoke and suites in Alpine (musl)
        run: |
          docker run --rm --security-opt seccomp=unconfined -e MORO_BORINGSSL_PIN -e MORO_PGO_REQUIRE=uring -v "$PWD:/repo" -w /repo node:24-alpine \
            sh -c "apk add --no-cache build-base clang compiler-rt lld llvm cmake git linux-headers && node tools/pgo.mjs --strict && npm run test:smoke && npm run test:suites"

  # The MSVC PGO cycle release.yml runs for the published Windows binaries
  # (instrument -> train -> pgomgr merge -> optimise, one cycle per binary),
  # strict: a runner image or toolset that cannot do it fails here, not in a
  # release, where the cycle is lenient and would quietly ship plain builds.
  # The suites then run against the PGO'd binaries.
  pgo-windows:
    runs-on: windows-latest
    env:
      MORO_ENGINE_REQUIRE_TRANSPORT: uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      # BoringSSL's x64 assembly on Windows is NASM source.
      - name: Install NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: PGO cycle (strict)
        run: node tools/pgo.mjs --strict
        env:
          MORO_PGO_WINDOWS: '1'
      - name: Smoke + every suite against the PGO-optimised binaries
        run: npm run test:smoke && npm run test:suites

  # Smoke every published binary flavor on a real instance of its target:
  # macos-15 = darwin-arm64 (macos-14 retired 2026-11-02), ubuntu = linux-gnu
  # (x64 and, on the -arm runner, arm64), alpine container = linux-musl.
  # darwin-x64 is still BUILT (Intel Macs) but not load-smoked here: GitHub's
  # Intel macOS runners (macos-13) are scarce and being retired, so queueing on
  # them stalls the gate. Binary filenames carry platform/arch/libc/abi, so
  # merge-multiple cannot clobber across flavors.
  smoke:
    needs: [darwin, linux-gnu, linux-musl]
    strategy:
      matrix:
        os: [macos-15, ubuntu-22.04, ubuntu-22.04-arm]
        node: [20, 22, 23, 24, 25, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_prefix }}binaries-*
          merge-multiple: true
          path: build/
      - run: node test/smoke.mjs

  # Same docker-run pattern as linux-musl (JS actions can't run in Alpine
  # containers on arm64 runners).
  smoke-musl:
    needs: [linux-musl]
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-24.04-arm]
        node: [20, 22, 23, 24, 25, 26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact_prefix }}binaries-linux-*-musl
          merge-multiple: true
          path: build/
      - name: Smoke test in Alpine container (musl)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo node:${{ matrix.node }}-alpine \
            node test/smoke.mjs

  smoke-windows:
    needs: [windows]
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 23, 24, 25, 26]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-windows-x64
          path: build/
      - run: node test/smoke.mjs

  # darwin-x64 ships cross-compiled from the arm64 build host (see the `darwin`
  # job) but Intel macOS runners are scarce/retiring, so the main `smoke` matrix
  # can't load-test it. Load-smoke it here under Rosetta 2 (pre-installed on
  # GitHub's arm64 macOS runners): install an x64 Node and run the smoke through
  # the x86_64 translation layer, so process.arch === 'x64' selects the
  # darwin-x64 binary. Cheap, and it exercises a binary real Intel-Mac users get.
  smoke-darwin-x64:
    needs: [darwin]
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 23, 24, 25, 26]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          architecture: x64 # x64 Node build; runs via Rosetta 2 on the arm64 host
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-darwin
          path: build/
      - run: arch -x86_64 node test/smoke.mjs

  # Full conformance on Windows for the running ABI — the same suite set the
  # Linux/macOS conformance legs run (smoke excepted; smoke-windows covers load).
  # The darwin/linux binaries get the whole suite, so the win32-x64 binary that
  # ships to users must too. Loopback-timing-sensitive suites run here; if one
  # proves flaky on the Windows runner, quarantine that single suite with a
  # comment rather than dropping the set.
  conformance-windows:
    needs: [windows]
    runs-on: windows-latest
    env:
      MORO_ENGINE_REQUIRE_TRANSPORT: uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_prefix }}binaries-windows-x64
          path: build/
      - run: npm run test:suites

  # Full conformance on macOS for the running ABI. The darwin binaries ship to
  # real users, so at least one darwin leg must run the whole suite (the smoke
  # matrix above only load-tests). Same Homebrew-LLVM CXX setup as the darwin
  # build job; same runner flavor as the darwin smoke leg (macos-15 = arm64).
  conformance-macos:
    runs-on: macos-15
    env:
      MORO_ENGINE_REQUIRE_TRANSPORT: uv
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # BoringSSL (the bundled-TLS binary) is built once per pin and toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/boringssl
          key: boringssl-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('tools/boringssl.json', 'tools/boringssl.mjs') }}
      - name: Use Homebrew LLVM (clang 18+ for Node 25/26 V8 headers)
        run: |
          brew list llvm >/dev/null 2>&1 || brew install llvm
          command -v cmake >/dev/null || brew install cmake
          echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
      - name: Build engine for this Node ABI
        run: node tools/build.mjs
      - name: Smoke + every node --test suite (package.json test:suites)
        run: npm run test:smoke && npm run test:suites

  # ── Single required gate ────────────────────────────────────────────────────

  # The one check branch protection should require. Goes green iff every job
  # above passed; a failure or cancellation (including a build whose dependent
  # smoke leg was therefore skipped) turns it red.
  ci-success:
    if: always()
    needs:
      - unit
      - integration
      - integration-variants
      - integration-uring
      - fallback-seccomp
      - conformance-musl-uring
      - pgo-linux
      - pgo-musl
      - pgo-windows
      - h1spec
      - asan-ubsan
      - asan-addon
      - fuzz-smoke
      - darwin
      - linux-gnu
      - linux-musl
      - windows
      - smoke
      - smoke-musl
      - smoke-windows
      - smoke-darwin-x64
      - conformance-windows
      - conformance-macos
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: echo "One or more CI jobs did not pass." && exit 1
      - run: echo "All CI jobs passed ✅"
